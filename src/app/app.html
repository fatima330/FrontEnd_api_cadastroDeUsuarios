
<main class="pagina">
  <section class="cartao">
    <h1>Cadastro de Usuário</h1>
    <p class="descricao">Preencha os dados para cadastrar um novo usuário.</p>

    <form (ngSubmit)="cadastrarUsuario()">
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input
          id="nome"
          name="nome"
          type="text"
          [(ngModel)]="nome"
          placeholder="Digite seu nome completo"
        />
      </div>

      <div class="campo">
        <label for="cpf">CPF</label>
        <input
          id="cpf"
          name="cpf"
          type="text"
          [(ngModel)]="cpf"
          placeholder="Digite seu CPF"
        />
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="Digite seu e-mail"
        />
      </div>

      <div class="campo">
        <label for="endereco">Endereço</label>
        <input
          id="endereco"
          name="endereco"
          type="text"
          [(ngModel)]="endereco"
          placeholder="Digite seu endereço"
        />
      </div>

      <div class="campo">
        <label for="telefone">Telefone</label>
        <input
          id="telefone"
          name="telefone"
          type="tel"
          [(ngModel)]="telefone"
          placeholder="Digite seu telefone"
        />
      </div>

      <button type="submit">Cadastrar usuário</button>
    </form>
  </section>
</main>
